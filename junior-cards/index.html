<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Junior Cards">
  <title>Junior Cards</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    .app{max-width:700px;margin:auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom))}
    header{display:flex;justify-content:space-between;align-items:center;gap:10px}
    h1{font-size:22px;margin:6px 0 14px}.cloud{font-size:12px;color:#9fb0cc}
    .panel{background:#121a2d;border:1px solid #2a3959;border-radius:20px;padding:16px;margin:12px 0}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .stat{background:#0d1527;border-radius:14px;text-align:center;padding:10px}.stat b{display:block;font-size:22px}.stat small{color:#9fb0cc}
    .card{min-height:330px;background:#111a2e;border:1px solid #30466f;border-radius:22px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    .tag{color:#9fb0cc;font-size:13px;margin-bottom:18px}.front{font-size:31px;font-weight:800}.back{font-size:22px;margin-top:20px;color:#dfe7f5;white-space:pre-line}
    button,select{font:inherit}select{width:100%;padding:12px;background:#1a2741;color:#fff;border:1px solid #314465;border-radius:12px}
    .primary{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#7c9cff;color:#071127;font-weight:800}
    .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.grades button{padding:10px 5px;border-radius:12px;background:#1c2942;color:white;border:1px solid #415476;font-weight:700}.grades small{display:block;color:#b7c3d7;margin-top:4px;min-height:14px}
    .hide{display:none!important}.muted{color:#9fb0cc}.row{display:flex;gap:8px}.ghost{flex:1;padding:12px;border-radius:12px;background:#111a2d;color:#fff;border:1px solid #30415f}
    .notice{font-size:13px;background:#18223a;border:1px solid #33476e;border-radius:14px;padding:12px;margin:10px 0;color:#c8d4e8}
    .error{background:#351a21;border-color:#713342;color:#ffd0d7}.loading{text-align:center;padding:46px 10px;color:#9fb0cc}
    @media(max-width:440px){.grades{grid-template-columns:repeat(2,1fr)}.front{font-size:28px}}
  </style>
</head>
<body>
<div class="app">
  <header><h1>🧠 Junior Cards</h1><div class="cloud" id="cloudStatus">☁️ conectando…</div></header>
  <div id="notice" class="notice hide"></div>

  <div id="loading" class="panel loading">Carregando seus cartões…</div>

  <main id="main" class="hide">
    <div class="panel">
      <select id="deck"></select>
      <div class="stats">
        <div class="stat"><b id="due">0</b><small>HOJE</small></div>
        <div class="stat"><b id="newc">0</b><small>NOVOS</small></div>
        <div class="stat"><b id="streak">0</b><small>SEQUÊNCIA</small></div>
      </div>
    </div>

    <div id="study">
      <div class="card">
        <div class="tag" id="tag"></div>
        <div class="front" id="front"></div>
        <div class="back hide" id="back"></div>
      </div>
      <button class="primary" id="show">Mostrar resposta</button>
      <div class="grades hide" id="grades">
        <button data-g="1">Errei<small id="i1">…</small></button>
        <button data-g="2">Difícil<small id="i2">…</small></button>
        <button data-g="3">Bom<small id="i3">…</small></button>
        <button data-g="4">Fácil<small id="i4">…</small></button>
      </div>
    </div>

    <div class="panel hide" id="done">
      <h2>Revisões concluídas 🎉</h2>
      <p class="muted">Nenhum cartão vencido neste baralho agora.</p>
    </div>

    <div class="panel">
      <div class="row">
        <button class="ghost" id="refresh">↻ Atualizar</button>
        <button class="ghost" id="backup">💾 Backup</button>
      </div>
      <p class="muted" style="font-size:12px;margin-bottom:0">
        FSRS • retenção-alvo 90% • progresso sincronizado na nuvem.
      </p>
    </div>
  </main>
</div>
<script>
const CACHE_KEY="juniorcards-cloud-cache-v3";
const API_BASE="https://vdqikaysebdondezpeqg.supabase.co/functions/v1/junior-cards-api";
const MIGRATION_KEY="juniorcards-legacy-migrated-v1";
const ACCESS_KEY="juniorcards-access-key";
const OLD_KEY="juniorcards-progress-v1";
let data={decks:[],cards:[],reviewDates:[]},deckId=null,current=null,preview=null;
let cloudMode=false,fallbackMode=false;
const FALLBACK_WORDS=[
  ["actually","na verdade / de fato","≠ atualmente"],["pretend","fingir / fazer de conta","≠ pretender"],
  ["parents","pais","≠ parentes"],["library","biblioteca","≠ livraria"],["college","faculdade","≠ colégio"],
  ["realize","perceber / dar-se conta","≠ realizar"],["eventually","finalmente / com o tempo","≠ eventualmente"],
  ["fabric","tecido","≠ fábrica"],["costume","fantasia / traje","≠ costume"],["lunch","almoço","≠ lanche"],
  ["novel","romance (livro)","≠ novela"],["sensible","sensato / razoável","≠ sensível"],
  ["sympathy","compaixão / solidariedade","≠ simpatia"],["push","empurrar","≠ puxar"],["pull","puxar","≠ pular"]
];
async function migrateLegacyIfNeeded(){
  if(localStorage.getItem(MIGRATION_KEY)) return false;
  let old=null;
  try{ old=JSON.parse(localStorage.getItem(OLD_KEY)||"null"); }catch{}
  if(!old?.cards){ localStorage.setItem(MIGRATION_KEY,"1"); return false; }
  const items=[];
  FALLBACK_WORDS.forEach((x,i)=>{
    const s=old.cards["eng-"+(i+1)];
    if(!s) return;
    const reps=Number(s.r||s.reps||0);
    if(!reps) return;
    items.push({
      front:x[0],
      reps,
      lapses:Number(s.l||s.lapses||0),
      stability:Number(s.s||s.stability||0.7),
      difficulty:Number(s.d||s.difficulty||5),
      due:Number(s.due||0),
      last:Number(s.last||0)
    });
  });
  if(items.length){
    const r=await api("/api/import-legacy",{method:"POST",body:JSON.stringify({items})});
    showNotice("Migrei "+(r.imported||0)+" cartão(ões) do progresso antigo deste iPhone para a nuvem.");
  }
  localStorage.setItem(MIGRATION_KEY,"1");
  return items.length>0;
}

function fallbackData(){
  let old={cards:{},streak:{count:0,last:null}};
  try{old=JSON.parse(localStorage.getItem(OLD_KEY)||JSON.stringify(old))}catch{}
  const cards=FALLBACK_WORDS.map((x,i)=>{
    const id="eng-"+(i+1),s=old.cards?.[id];
    let review=null;
    if(s&&(s.r||s.reps)){
      const reps=s.r||s.reps||0;
      review={card_id:id,fsrs_card:{
        reps,lapses:s.l||s.lapses||0,stability:s.s||s.stability||0.7,difficulty:s.d||s.difficulty||5,
        due:new Date(s.due||Date.now()).toISOString(),
        last_review:s.last?new Date(s.last).toISOString():null,state:2,scheduled_days:0,elapsed_days:0,learning_steps:0
      }};
    }
    return {id,deck_id:"english-false-friends",front:x[0],back:x[1],note:x[2],sort_order:i+1,review};
  });
  return {decks:[{id:"english-false-friends",name:"🇬🇧 Inglês — Falsos cognatos",sort_order:10}],cards,reviewDates:old.streak?.last?[old.streak.last+"T12:00:00Z"]:[]};
}

const $=id=>document.getElementById(id);
function accessKey(){return localStorage.getItem(ACCESS_KEY)||""}
async function api(url, options={}, allowPrompt=true){
  const headers={"Content-Type":"application/json",...(options.headers||{})};
  if(accessKey()) headers["x-junior-key"]=accessKey();
  const target=url.startsWith("/api/") ? API_BASE+"/"+url.slice(5) : url;
  const res=await fetch(target,{...options,headers});
  if(res.status===401 && allowPrompt){
    const key=prompt("Digite a chave de acesso do Junior Cards:");
    if(key){localStorage.setItem(ACCESS_KEY,key.trim());return api(url,options,false)}
  }
  if(!res.ok){
    const body=await res.json().catch(()=>({}));
    throw new Error(body.detail||body.error||("HTTP "+res.status));
  }
  return res.json();
}
function setCloud(text,ok=true){$("cloudStatus").textContent=(ok?"☁️ ":"⚠️ ")+text}
function showNotice(text,error=false){
  $("notice").textContent=text;$("notice").classList.remove("hide","error");
  if(error)$("notice").classList.add("error");
}
function hideNotice(){$("notice").classList.add("hide")}
function stateOf(c){return c.review?.fsrs_card||null}
function isNew(c){const s=stateOf(c);return !s||!s.reps}
function isDue(c){const s=stateOf(c);return s&&new Date(s.due).getTime()<=Date.now()}
function currentDeckCards(){return data.cards.filter(c=>c.deck_id===deckId)}
function calcStreak(){
  const days=new Set((data.reviewDates||[]).map(x=>new Date(x).toISOString().slice(0,10)));
  let n=0,d=new Date();
  const today=d.toISOString().slice(0,10);
  if(!days.has(today)){d.setDate(d.getDate()-1)}
  while(days.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function stats(){
  const cards=currentDeckCards();
  $("due").textContent=cards.filter(isDue).length;
  $("newc").textContent=cards.filter(isNew).length;
  $("streak").textContent=calcStreak();
}
function formatInterval(iso){
  const ms=new Date(iso).getTime()-Date.now();
  if(ms<=0)return "agora";
  const min=ms/60000;
  if(min<60)return Math.max(1,Math.round(min))+" min";
  const h=min/60;if(h<24)return Math.max(1,Math.round(h))+" h";
  const d=h/24;if(d<30)return Math.round(d)+" d";
  if(d<365)return Math.round(d/30)+" mês"+(Math.round(d/30)>1?"es":"");
  return (d/365).toFixed(1)+" a";
}
async function loadPreview(){
  preview=null;[1,2,3,4].forEach(g=>$("i"+g).textContent="…");
  if(!current)return;
  try{
    const r=await api("/api/preview",{method:"POST",body:JSON.stringify({cardId:current.id})});
    preview=r.preview;
    $("i1").textContent=formatInterval(preview.again.due);
    $("i2").textContent=formatInterval(preview.hard.due);
    $("i3").textContent=formatInterval(preview.good.due);
    $("i4").textContent=formatInterval(preview.easy.due);
  }catch(e){[1,2,3,4].forEach(g=>$("i"+g).textContent="online");}
}
function next(){
  stats();
  const cards=currentDeckCards().filter(c=>isDue(c)||isNew(c)).sort((a,b)=>{
    if(isDue(a)&&!isDue(b))return-1;if(!isDue(a)&&isDue(b))return 1;
    if(isNew(a)&&!isNew(b))return 1;if(!isNew(a)&&isNew(b))return-1;
    const ad=stateOf(a)?.due||"9999",bd=stateOf(b)?.due||"9999";
    return String(ad).localeCompare(String(bd));
  });
  current=cards[0]||null;
  if(!current){$("study").classList.add("hide");$("done").classList.remove("hide");return}
  $("study").classList.remove("hide");$("done").classList.add("hide");
  const s=stateOf(current);
  $("tag").textContent=isNew(current)?"Novo":"Revisão "+(s.reps||0);
  $("front").textContent=current.front;
  $("back").textContent=current.back+(current.note?"\n"+current.note:"");
  $("back").classList.add("hide");$("grades").classList.add("hide");$("show").classList.remove("hide");
  loadPreview();
}
function renderDecks(){
  $("deck").innerHTML=data.decks.map(d=>'<option value="'+d.id+'">'+d.name+'</option>').join("");
  if(!deckId||!data.decks.some(d=>d.id===deckId))deckId=data.decks[0]?.id||null;
  $("deck").value=deckId||"";
}
async function load(){
  hideNotice();setCloud("sincronizando…");
  try{
    data=await api("/api/cards");
    cloudMode=true;fallbackMode=false;
    const migrated=await migrateLegacyIfNeeded();
    if(migrated) data=await api("/api/cards");
    localStorage.setItem(CACHE_KEY,JSON.stringify(data));
    setCloud("sincronizado");
  }catch(e){
    const cached=localStorage.getItem(CACHE_KEY);
    if(cached){
      data=JSON.parse(cached);setCloud("modo offline",false);
      showNotice("Sem conexão com a nuvem. Mostrando o último conteúdo salvo neste aparelho.",true);
    }else{
      data=fallbackData();fallbackMode=true;cloudMode=false;
      setCloud("modo local",false);
      showNotice("O Supabase ainda não está configurado. O app continua funcionando com o progresso deste iPhone; quando a nuvem estiver pronta, ele passará a sincronizar automaticamente.",true);
    }
  }
  $("loading").classList.add("hide");$("main").classList.remove("hide");
  renderDecks();next();
  if(localStorage.getItem(OLD_KEY) && !localStorage.getItem(MIGRATION_KEY)){
    showNotice("Encontrei progresso da versão antiga neste iPhone e vou migrá-lo para a nuvem.");
  }
}
function localGrade(g){
  const old=(()=>{try{return JSON.parse(localStorage.getItem(OLD_KEY)||'{"cards":{},"streak":{"count":0,"last":null}}')}catch{return {cards:{},streak:{count:0,last:null}}}})();
  const s=old.cards[current.id]||(old.cards[current.id]={r:0,l:0,s:.7,d:5,due:0,last:0});
  const t=Date.now(),DAY=86400000,elapsed=s.last?Math.max(.01,(t-s.last)/DAY):0;
  let iv;
  if(!s.r)iv=[0,10/1440,1,3,7][g];
  else{
    const retr=Math.exp(-elapsed/Math.max(.25,s.s||.7));
    const mult=[0,.18,1.22,2.15,3.2][g];
    iv=Math.max(.08,(s.s||.7)*mult);
    if(g>1)iv*=Math.max(.75,Math.min(1.45,1+(1-retr)*.55));
    iv=g===1?Math.max(10/1440,Math.min(.5,iv)):Math.max(g===2?.5:1,Math.min(36500,iv));
  }
  if(g===1){s.l=(s.l||0)+1;s.d=Math.min(10,(s.d||5)+.8);s.s=Math.max(.25,(s.s||.7)*.45)}
  if(g===2){s.d=Math.min(10,(s.d||5)+.18);s.s=Math.max(.6,(s.s||.7)*1.18+elapsed*.08)}
  if(g===3){s.d=Math.max(1,(s.d||5)-.12);s.s=Math.max(1,(s.s||.7)*1.85+elapsed*.18)}
  if(g===4){s.d=Math.max(1,(s.d||5)-.35);s.s=Math.max(2,(s.s||.7)*2.65+elapsed*.28)}
  s.r=(s.r||0)+1;s.last=t;s.due=t+iv*DAY;
  const today=new Date().toISOString().slice(0,10);
  if(old.streak.last!==today){const y=new Date();y.setDate(y.getDate()-1);old.streak.count=old.streak.last===y.toISOString().slice(0,10)?(old.streak.count||0)+1:1;old.streak.last=today}
  localStorage.setItem(OLD_KEY,JSON.stringify(old));
  data=fallbackData();renderDecks();setCloud("salvo neste iPhone");next();
}
async function grade(g){
  if(!current)return;
  if(fallbackMode){localGrade(g);return}
  document.querySelectorAll("[data-g]").forEach(b=>b.disabled=true);
  try{
    const r=await api("/api/review",{method:"POST",body:JSON.stringify({cardId:current.id,grade:g})});
    current.review={card_id:current.id,fsrs_card:r.card,last_grade:g,updated_at:new Date().toISOString()};
    data.reviewDates.unshift(new Date().toISOString());
    localStorage.setItem(CACHE_KEY,JSON.stringify(data));
    setCloud("salvo ✓");
    next();
  }catch(e){
    showNotice("Não consegui salvar esta resposta: "+e.message,true);setCloud("não salvo",false);
  }finally{document.querySelectorAll("[data-g]").forEach(b=>b.disabled=false)}
}
$("show").onclick=()=>{$("back").classList.remove("hide");$("grades").classList.remove("hide");$("show").classList.add("hide")};
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
$("deck").onchange=e=>{deckId=e.target.value;next()};
$("refresh").onclick=load;
$("backup").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="junior-cards-cloud-backup.json";a.click();
};
load();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
